spring:
  application:
    name: queueflow-backend
  # TEMPORARY (Phase 0.5.4 only): Spring Data JPA and the PostgreSQL driver are on
  # the classpath, but no database is configured yet. Without a datasource,
  # Spring Boot's autoconfiguration would otherwise fail application startup.
  # These autoconfiguration classes are excluded so the app can start for
  # foundation verification. Remove this exclusion once PostgreSQL connection
  # settings are introduced in a later phase.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcClientAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

server:
  port: 8080
