spring:
  application:
    name: queueflow-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Flyway (db/migration) owns the schema; Hibernate only checks at
      # startup that the entities match it. Never "update"/"create"/
      # "create-drop".
      ddl-auto: validate
    show-sql: false
    # No persistence context held open for the whole HTTP request: every
    # lazy association must be read (and every DTO built) inside the
    # service's @Transactional method, never during controller execution
    # or JSON serialization.
    open-in-view: false

server:
  port: 8080
  # Behind a reverse proxy (the Docker stack's nginx, a future TLS proxy):
  # Tomcat's RemoteIpValve takes the client's scheme, host, port and address
  # from X-Forwarded-Proto/-Host/-Port/-For - but only when the request comes
  # from an internal proxy (private address ranges, which include Docker's
  # networks); from anyone else those headers are ignored. Requests without
  # them (local development) are unaffected. The browser-visible scheme,
  # host and port matter for CORS (a same-origin request must be seen as
  # same-origin) and for the absolute Location headers of 201 responses.
  forward-headers-strategy: native

springdoc:
  # The API is JSON-only; without this Springdoc documents undeclared
  # response types as */*.
  default-produces-media-type: application/json

queueflow:
  cors:
    # Exact browser origins allowed to call this backend across origins
    # (CorsProperties): comma-separated, never a wildcard. The default is the
    # Vite dev server. A frontend served from this backend's own origin
    # (through the Docker stack's nginx proxy) needs no entry.
    allowed-origins: ${QUEUEFLOW_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      # Base64-encoded HS256 key of at least 32 bytes, e.g. the output of
      # `openssl rand -base64 32`. Required: the application refuses to start
      # without it. The empty default is not a fallback key - it only turns a
      # missing JWT_SECRET into an empty value that JwtConfig rejects with a
      # clear "not set" message (an unresolved placeholder would otherwise
      # reach the key decoder literally). Never commit a real value.
      secret: ${JWT_SECRET:}
      issuer: queueflow
      ttl: PT1H
