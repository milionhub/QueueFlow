spring:
  application:
    name: queueflow-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Safe for this stage: no entities exist yet, so there is nothing to
      # validate against. This must stay "validate" (never "update"/"create"/
      # "create-drop") until a migration tool (Flyway/Liquibase) owns the schema.
      ddl-auto: validate
    show-sql: false
    # No persistence context held open for the whole HTTP request: every
    # lazy association must be read (and every DTO built) inside the
    # service's @Transactional method, never during controller execution
    # or JSON serialization.
    open-in-view: false

server:
  port: 8080
