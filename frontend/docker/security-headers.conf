# Included by the locations that serve the app itself (docker/nginx.conf).
# The API's responses carry the backend's own security headers (Spring
# Security), so these are not added to proxied responses twice.
#
# Only simple headers that cannot break QueueFlow: no Content-Security-Policy
# yet (it needs its own review of what the app loads).

# Do not guess content types: a file is only what its Content-Type says.
add_header X-Content-Type-Options "nosniff" always;
# QueueFlow is never meant to be shown inside another site's frame.
add_header X-Frame-Options "DENY" always;
# Other sites see only QueueFlow's origin, never a page's full address.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
