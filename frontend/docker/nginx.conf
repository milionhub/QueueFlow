# QueueFlow frontend (nginx-unprivileged, included in the http block).
#
# One origin for the browser: nginx serves the Vite build and proxies the
# backend's two public paths - /api/ and /actuator/health - to the Compose
# service "backend". Swagger UI and /v3/api-docs are deliberately not
# proxied. The backend trusts the X-Forwarded-* headers set here
# (server.forward-headers-strategy: native), so it sees the browser's own
# scheme, host and port: same-origin requests stay same-origin (no CORS),
# and 201 Location headers point at the address the browser used.

# The port in the browser's address (e.g. 8088 for http://localhost:8088),
# which is not nginx's own container port. Without X-Forwarded-Port the
# backend would assume 80/443 and treat the request as cross-origin.
map $scheme $default_forwarded_port {
    https   443;
    default 80;
}
map $http_host $forwarded_port {
    "~:(?<port>[0-9]+)$" $port;
    default              $default_forwarded_port;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # The backend is looked up through Docker's DNS on each request (not
    # once at startup), so nginx starts even when "backend" does not exist
    # yet, and follows the backend container if it is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    # --------------------------------------------------------- backend ----
    # proxy_pass with a variable and no URI part forwards the request's path
    # and query exactly as the browser sent them.
    location /api/ {
        proxy_pass $backend;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location = /actuator/health {
        proxy_pass $backend;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # ------------------------------------------------------ static app ----
    # Vite's hashed bundles: the name changes with the content, so they can
    # be cached for a year. A missing file is a 404, never the app's HTML.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Everything else is the single-page app: an existing file (the
    # favicon), or index.html for any route React Router handles in the
    # browser (/app, /app/projects/CORE, ...), so a refresh or a shared
    # link works. index.html is revalidated on every visit, so a new
    # deployment is picked up at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
