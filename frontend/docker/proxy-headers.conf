# Included by every location that proxies to the backend (docker/nginx.conf).

proxy_http_version 1.1;
proxy_set_header Connection "";

# What the browser asked for: host (with its port), scheme and port, and
# who asked. The backend reads these because nginx is an internal proxy to
# it (server.forward-headers-strategy: native).
proxy_set_header Host              $http_host;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $forwarded_port;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Real-IP         $remote_addr;
